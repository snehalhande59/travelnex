<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Client Login | TRAVELNEX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(7, 55, 127, 0.96) 0%, rgba(11, 43, 99, 0.92) 50%, rgba(6, 28, 64, 0.96) 100%),
                        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1800') center/cover no-repeat;
            padding: 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: var(--radius-lg);
            padding: 38px 32px;
            box-shadow: 0 25px 60px rgba(6, 28, 64, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 26px;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 20px;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
        }
        .auth-logo .icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: var(--purple-btn-gradient);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 20px;
        }
        .auth-logo span { color: var(--pink); }
        .demo-chip {
            background: var(--purple-light);
            border: 1px dashed var(--blue-primary);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 20px;
            font-size: 12.5px;
            cursor: pointer;
            transition: var(--transition);
        }
        .demo-chip:hover {
            background: #dbe8f7;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <a href="corporate.html" class="auth-logo">
            <div class="icon"><i class="fa-solid fa-briefcase"></i></div>
            TRAVEL<span>NEX</span> <small style="font-size:11px; background:var(--pink-light); color:var(--pink); padding:2px 7px; border-radius:4px; margin-left:6px; font-weight:800;">CORP</small>
        </a>

        <h2 style="font-size: 22px; text-align: center; margin-bottom: 6px; color:var(--navy); font-weight:800;">Corporate Portal Login</h2>
        <p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">
            Sign in to manage employee rides, monthly bills and corporate rosters
        </p>

        <!-- Clickable Demo Autofill -->
        <div class="demo-chip" onclick="fillDemoCorp()">
            <div style="font-weight: 800; color: var(--blue-primary); margin-bottom: 4px;">
                <i class="fa-solid fa-bolt"></i> Click to autofill Demo Corporate Account:
            </div>
            <div>Email: <strong style="color:var(--navy);">corporate@travelnex.com</strong></div>
            <div>Password: <strong style="color:var(--navy);">Corp@123</strong></div>
        </div>

        <form id="corpLoginForm">
            <div class="form-group" style="margin-bottom:16px;">
                <label for="email" style="font-weight:700; color:var(--navy); display:block; margin-bottom:6px; font-size:13px;">Business Email</label>
                <input type="email" id="email" class="form-control" placeholder="corporate@travelnex.com" required style="height:46px; border-radius:10px;">
            </div>
            <div class="form-group" style="margin-bottom:20px;">
                <label for="password" style="font-weight:700; color:var(--navy); display:block; margin-bottom:6px; font-size:13px;">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required style="height:46px; border-radius:10px;">
            </div>

            <button type="submit" class="btn btn-lg" style="width: 100%; height: 48px; background:var(--purple-btn-gradient); color:#fff; font-weight:700; border:none; border-radius:12px; font-size:14px;">
                Sign In to Corporate Dashboard <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
            New enterprise client? <a href="corporate-register.html" style="color: var(--pink); font-weight: 700;">Register Organization</a>
        </div>

        <div style="border-top: 1px solid var(--border); margin-top: 24px; padding-top: 16px; text-align: center;">
            <div style="display: flex; justify-content: center; gap: 14px; font-size: 12px; font-weight: 700;">
                <a href="../customer/login.html" style="color: var(--blue-primary);">Customer Login</a>
                <span>•</span>
                <a href="../admin/admin-login.html" style="color: var(--blue-primary);">Admin Panel</a>
                <span>•</span>
                <a href="../driver/driver-login.html" style="color: var(--blue-primary);">Driver Portal</a>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/storage.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
    function fillDemoCorp() {
        document.getElementById('email').value = 'corporate@travelnex.com';
        document.getElementById('password').value = 'Corp@123';
        Utils.showToast('Demo corporate credentials filled!', 'info');
    }

    // Guard if already logged in as corporate
    const current = Auth.getCurrentUser();
    if (current && current.role === 'corporate') {
        window.location.href = 'corporate-dashboard.html';
    }

    document.getElementById('corpLoginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const pwd = document.getElementById('password').value;

        const res = Auth.login(email, pwd);
        if (res.success && res.user.role === 'corporate') {
            Utils.showToast('Welcome to TRAVELNEX Corporate Suite, ' + res.user.companyName, 'success');
            setTimeout(() => {
                window.location.href = 'corporate-dashboard.html';
            }, 800);
        } else if (res.success) {
            Utils.showToast('Logged in user is not a corporate account.', 'warning');
        } else {
            Utils.showToast(res.message, 'danger');
        }
    });
</script>
</body>
</html>
