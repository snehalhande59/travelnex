<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Account Registration | TRAVELNEX Business</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(27, 7, 66, 0.95) 0%, rgba(67, 20, 135, 0.90) 50%, rgba(124, 58, 237, 0.85) 100%),
                        url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=1800') center/cover no-repeat;
            padding: 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 540px;
            background: #ffffff;
            border-radius: var(--radius-lg);
            padding: 38px 32px;
            box-shadow: 0 25px 60px rgba(27, 7, 66, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 26px;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 20px;
            text-decoration: none;
            font-family: 'Outfit', sans-serif;
        }
        .auth-logo .icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: var(--purple-btn-gradient);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 20px;
        }
        .auth-logo span { color: var(--pink); }
    </style>
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <a href="corporate.html" class="auth-logo">
            <div class="icon"><i class="fa-solid fa-briefcase"></i></div>
            TRAVEL<span>NEX</span> <small style="font-size:11px; background:var(--pink-light); color:var(--pink); padding:2px 7px; border-radius:4px; margin-left:6px; font-weight:800;">ENTERPRISE</small>
        </a>

        <h2 style="font-size: 22px; text-align: center; margin-bottom: 6px; color:var(--navy); font-weight:800;">Register Organization</h2>
        <p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 22px;">
            Set up corporate mobility management, automated rosters and monthly GST billing
        </p>

        <form id="corpRegisterForm">
            <div class="form-row" style="margin-bottom:14px;">
                <div class="form-group">
                    <label for="companyName" style="font-weight:700; color:var(--navy); font-size:13px; display:block; margin-bottom:5px;">Company / Enterprise Name *</label>
                    <input type="text" id="companyName" class="form-control" placeholder="e.g. Apex Global Solutions" required style="height:44px; border-radius:10px;">
                </div>
                <div class="form-group">
                    <label for="gstin" style="font-weight:700; color:var(--navy); font-size:13px; display:block; margin-bottom:5px;">Company GSTIN *</label>
                    <input type="text" id="gstin" class="form-control" placeholder="27AAACT1234F1Z1" required style="height:44px; border-radius:10px;">
                </div>
            </div>

            <div class="form-row" style="margin-bottom:14px;">
                <div class="form-group">
                    <label for="contactPerson" style="font-weight:700; color:var(--navy); font-size:13px; display:block; margin-bottom:5px;">Authorized Admin Name *</label>
                    <input type="text" id="contactPerson" class="form-control" placeholder="Pooja Deshmukh" required style="height:44px; border-radius:10px;">
                </div>
                <div class="form-group">
                    <label for="phone" style="font-weight:700; color:var(--navy); font-size:13px; display:block; margin-bottom:5px;">Mobile Number *</label>
                    <input type="tel" id="phone" pattern="[0-9]{10}" class="form-control" placeholder="9822011223" required style="height:44px; border-radius:10px;">
                </div>
            </div>

            <div class="form-row" style="margin-bottom:14px;">
                <div class="form-group">
                    <label for="email" style="font-weight:700; color:var(--navy); font-size:13px; display:block; margin-bottom:5px;">Official Work Email *</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@apexsolutions.com" required style="height:44px; border-radius:10px;">
                </div>
                <div class="form-group">
                    <label for="password" style="font-weight:700; color:var(--navy); font-size:13px; display:block; margin-bottom:5px;">Account Password *</label>
                    <input type="password" id="password" class="form-control" placeholder="Min 6 characters" minlength="6" required style="height:44px; border-radius:10px;">
                </div>
            </div>

            <div class="form-row" style="margin-bottom:18px;">
                <div class="form-group">
                    <label for="employeeCount" style="font-weight:700; color:var(--navy); font-size:13px; display:block; margin-bottom:5px;">Employee Workforce</label>
                    <select id="employeeCount" class="form-control" style="height:44px; border-radius:10px;">
                        <option>10 - 50 Employees</option>
                        <option selected>50 - 200 Employees</option>
                        <option>200 - 500 Employees</option>
                        <option>500+ Employees (Custom Enterprise)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="city" style="font-weight:700; color:var(--navy); font-size:13px; display:block; margin-bottom:5px;">Headquarters City</label>
                    <input type="text" id="city" class="form-control" placeholder="Pune / Mumbai" style="height:44px; border-radius:10px;">
                </div>
            </div>

            <button type="submit" class="btn btn-lg" style="width: 100%; height: 48px; background:var(--purple-btn-gradient); color:#fff; font-weight:700; border:none; border-radius:12px; font-size:14px;">
                Register Corporate Account <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
            Already have a corporate portal? <a href="corporate-login.html" style="color: var(--pink); font-weight: 700;">Sign In</a>
        </div>
    </div>
</div>

<script src="../assets/js/storage.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
    document.getElementById('corpRegisterForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const comp = document.getElementById('companyName').value.trim();
        const gstin = document.getElementById('gstin').value.trim();
        const contact = document.getElementById('contactPerson').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const pwd = document.getElementById('password').value;
        const city = document.getElementById('city').value.trim() || 'Pune';

        const client = StorageManager.saveCorporateClient({
            companyName: comp,
            gstin: gstin,
            contactPerson: contact,
            email: email,
            phone: phone,
            password: pwd,
            city: city,
            status: 'Active',
            role: 'corporate'
        });

        Auth.setCurrentUser(client);
        Utils.showToast(`Organization account created for ${comp}! Redirecting...`, 'success');
        setTimeout(() => {
            window.location.href = 'corporate-dashboard.html';
        }, 1000);
    });
</script>
</body>
</html>
