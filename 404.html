<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="2; url=customer/index.html">
    <title>Redirecting to TRAVELNEX...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #07377F 0%, #0B2B63 60%, #061C40 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
        }
        .redirect-card {
            background: #ffffff;
            color: #14233F;
            max-width: 480px;
            width: 100%;
            border-radius: 20px;
            padding: 42px 32px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
        }
        .brand-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: #07377F;
            margin-bottom: 20px;
            text-decoration: none;
        }
        .brand-logo .icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: #07377F;
            color: #F5B51B;
            display: grid;
            place-items: center;
            font-size: 20px;
        }
        .brand-logo span { color: #F5B51B; }
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #07377F;
            margin-bottom: 10px;
            font-family: 'Outfit', sans-serif;
        }
        p {
            font-size: 14px;
            color: #64748B;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #EAF1FA;
            border-top: 3px solid #07377F;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #F5B51B;
            color: #07377F;
            font-weight: 700;
            font-size: 14px;
            padding: 12px 28px;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-home:hover {
            background: #DE9F0C;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(245, 181, 27, 0.35);
        }
    </style>
    <script>
        // Automatic immediate redirect
        setTimeout(function() {
            window.location.replace('customer/index.html');
        }, 1200);
    </script>
</head>
<body>
    <div class="redirect-card">
        <a href="customer/index.html" class="brand-logo">
            <div class="icon"><i class="fa-solid fa-route"></i></div>
            <div>TRAVEL<span>NEX</span></div>
        </a>
        <div class="spinner"></div>
        <h1>Redirecting to TRAVELNEX Platform</h1>
        <p>You are being redirected to the homepage. If your browser does not redirect automatically within 2 seconds, click below:</p>
        <a href="customer/index.html" class="btn-home">
            <span>Go to Homepage</span> <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>
</body>
</html>
