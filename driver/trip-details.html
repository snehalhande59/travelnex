<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Details & Passenger Manifest | TRAVELNEX Driver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>

<div class="dashboard-wrapper">
    <aside class="dashboard-sidebar" id="sidebar">
        <div class="sidebar-brand">
            <a href="../customer/index.html" title="Return to Main Homepage" style="display:flex; align-items:center; gap:10px;">
                <div class="logo-icon" style="background:var(--orange);"><i class="fa-solid fa-id-card"></i></div>
                <div class="brand-text">TRAVEL<span>NEX</span></div>
            </a>
            <span class="sidebar-badge" style="background:rgba(255,118,40,0.25); color:var(--orange);">Driver</span>
        </div>

        <div class="sidebar-menu">
            <div class="sidebar-section-title">Driver App</div>
            <a href="driver-dashboard.html" class="sidebar-link">
                <i class="fa-solid fa-gauge-high"></i>
                <span>Driver Dashboard</span>
            </a>
            <a href="assigned-trips.html" class="sidebar-link active">
                <i class="fa-solid fa-car-side"></i>
                <span>Assigned Trips</span>
            </a>
            <a href="trip-history.html" class="sidebar-link">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Trip History & Earnings</span>
            </a>
            <a href="driver-profile.html" class="sidebar-link">
                <i class="fa-solid fa-user-gear"></i>
                <span>Driver Profile</span>
            </a>
        </div>

        <div class="sidebar-footer">
            <div class="sidebar-user-avatar" style="background:var(--orange);">D</div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name">Ramesh Pawar</div>
                <div class="sidebar-user-role">Fleet Chauffeur</div>
            </div>
            <button type="button" class="sidebar-logout-btn" onclick="Auth.logout('../driver/driver-login.html')">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </button>
        </div>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-header">
            <div class="header-left">
                <button class="sidebar-toggle-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div>
                    <div class="page-breadcrumb"><a href="assigned-trips.html">Assigned Trips</a> &gt; Manifest</div>
                    <h1 class="page-title">Passenger Manifest & Route Details</h1>
                </div>
            </div>

            <div class="header-right">
                <a href="assigned-trips.html" class="btn btn-outline btn-sm">
                    <i class="fa-solid fa-arrow-left"></i> Back to Trips
                </a>
            </div>
        </header>

        <div class="dashboard-content">
            <div id="tripDetailsCard" class="table-card" style="padding:32px; max-width:850px; margin:0 auto;">
                <!-- Injected dynamically -->
            </div>
        </div>
    </main>
</div>

<script src="../assets/js/storage.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
    const user = Auth.requireRole('driver', 'driver-login.html');
    const driverId = (user && user.driverId) ? user.driverId : 'DRV-101';

    const urlParams = new URLSearchParams(window.location.search);
    const bookingId = urlParams.get('id') || 'TNX-BOOKING-1001';

    function renderTripDetails() {
        const b = StorageManager.getBookingById(bookingId);
        const card = document.getElementById('tripDetailsCard');

        if (!b) {
            card.innerHTML = `
                <div class="empty-state">
                    <h3>Trip Assignment Not Found</h3>
                    <p>Reference ${Utils.escapeHTML(bookingId)} is not assigned to your driver ID.</p>
                    <a href="assigned-trips.html" class="btn btn-primary">Return to Assigned Trips</a>
                </div>
            `;
            return;
        }

        const vehicle = b.vehicleId ? StorageManager.getVehicleById(b.vehicleId) : null;
        const isConfirmed = b.bookingStatus === 'Confirmed';
        const isInProgress = b.bookingStatus === 'In Progress';
        const isCompleted = b.bookingStatus === 'Completed';

        card.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--border); padding-bottom:20px; margin-bottom:24px;">
                <div>
                    <span style="font-size:12px; font-weight:800; color:var(--orange); text-transform:uppercase; letter-spacing:1px;">
                        ${Utils.escapeHTML(b.serviceType)} TRIP
                    </span>
                    <h2 style="font-size:26px; color:var(--navy); margin-top:2px;">${Utils.escapeHTML(b.id)}</h2>
                    <p style="font-size:13px; color:var(--text-muted);">Assigned to Driver: <strong>${Utils.escapeHTML(user.name || 'Ramesh Pawar')}</strong></p>
                </div>
                <div style="text-align:right;">
                    <div>${Utils.getStatusBadge(b.bookingStatus)}</div>
                    <div style="font-size:22px; font-weight:800; color:var(--navy); margin-top:6px;">${Utils.formatCurrency(b.estimatedFare)}</div>
                </div>
            </div>

            <!-- Passenger Contact Information -->
            <div style="background:#f8fafc; border:1px solid var(--border); border-radius:var(--radius-md); padding:20px; margin-bottom:24px;">
                <h4 style="font-size:16px; margin-bottom:14px; color:var(--navy);"><i class="fa-solid fa-user-circle" style="color:var(--blue);"></i> Passenger Contact</h4>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                    <div>
                        <div style="font-size:12px; color:var(--text-muted); font-weight:700;">CUSTOMER NAME</div>
                        <div style="font-size:16px; font-weight:700; color:var(--navy); margin-top:2px;">
                            ${Utils.escapeHTML(b.customerName)}
                        </div>
                    </div>
                    <div>
                        <div style="font-size:12px; color:var(--text-muted); font-weight:700;">MOBILE NUMBER (TAP TO CALL)</div>
                        <a href="tel:${b.customerPhone}" style="font-size:16px; font-weight:800; color:var(--blue); display:inline-flex; align-items:center; gap:6px; margin-top:2px;">
                            <i class="fa-solid fa-phone"></i> ${Utils.escapeHTML(b.customerPhone)}
                        </a>
                    </div>
                    <div>
                        <div style="font-size:12px; color:var(--text-muted); font-weight:700;">PASSENGER COUNT</div>
                        <div style="font-size:14px; margin-top:2px;">${b.passengers} Passenger(s)</div>
                    </div>
                    <div>
                        <div style="font-size:12px; color:var(--text-muted); font-weight:700;">CUSTOMER EMAIL</div>
                        <div style="font-size:14px; margin-top:2px;">${Utils.escapeHTML(b.customerEmail || 'N/A')}</div>
                    </div>
                </div>
            </div>

            <!-- Route & Timings -->
            <div style="border:1px solid var(--border); border-radius:var(--radius-md); padding:20px; margin-bottom:24px;">
                <h4 style="font-size:16px; margin-bottom:14px; color:var(--navy);"><i class="fa-solid fa-location-crosshairs" style="color:var(--orange);"></i> Route & Schedule</h4>
                <div style="display:grid; gap:14px;">
                    <div style="display:flex; gap:12px;">
                        <div style="width:28px; height:28px; border-radius:50%; background:var(--orange-light); color:var(--orange); display:grid; place-items:center; font-size:12px; flex-shrink:0;">
                            <i class="fa-solid fa-arrow-up"></i>
                        </div>
                        <div>
                            <div style="font-size:11px; font-weight:700; color:var(--text-muted);">PICKUP LOCATION</div>
                            <div style="font-size:15px; font-weight:700; color:var(--navy);">${Utils.escapeHTML(b.pickup)}</div>
                        </div>
                    </div>

                    <div style="display:flex; gap:12px;">
                        <div style="width:28px; height:28px; border-radius:50%; background:var(--blue-light); color:var(--blue); display:grid; place-items:center; font-size:12px; flex-shrink:0;">
                            <i class="fa-solid fa-arrow-down"></i>
                        </div>
                        <div>
                            <div style="font-size:11px; font-weight:700; color:var(--text-muted);">DROP DESTINATION</div>
                            <div style="font-size:15px; font-weight:700; color:var(--navy);">${Utils.escapeHTML(b.destination)}</div>
                        </div>
                    </div>

                    <div style="border-top:1px dashed var(--border); padding-top:12px; display:flex; justify-content:space-between; font-size:13px;">
                        <span>Scheduled Date: <strong>${Utils.formatDate(b.journeyDate)}</strong></span>
                        <span>Pickup Time: <strong>${Utils.escapeHTML(b.journeyTime || '--:--')}</strong></span>
                    </div>
                </div>
            </div>

            <!-- Vehicle Details -->
            <div style="background:#f1f5f9; border-radius:var(--radius-md); padding:16px 20px; margin-bottom:28px; display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <div style="font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase;">Assigned Duty Vehicle</div>
                    <div style="font-size:15px; font-weight:700; color:var(--navy);">${vehicle ? Utils.escapeHTML(vehicle.name) : 'Fleet Car'}</div>
                </div>
                <div style="text-align:right;">
                    <div style="font-size:16px; font-weight:800; color:var(--blue);">${vehicle ? Utils.escapeHTML(vehicle.regNumber) : 'Assigned'}</div>
                    <small style="color:var(--text-muted);">${vehicle ? Utils.escapeHTML(vehicle.type) : 'Standard'}</small>
                </div>
            </div>

            <!-- Action Buttons -->
            <div>
                ${isConfirmed ? `
                    <button type="button" class="btn btn-primary btn-lg" style="width:100%;" onclick="startTripAction('${b.id}')">
                        <i class="fa-solid fa-play"></i> Start Trip (Notify Passenger & Operations)
                    </button>
                ` : (isInProgress ? `
                    <button type="button" class="btn btn-success btn-lg" style="width:100%;" onclick="completeTripAction('${b.id}')">
                        <i class="fa-solid fa-flag-checkered"></i> Passenger Dropped - Complete Trip
                    </button>
                ` : `
                    <div style="text-align:center; padding:12px; background:#ecfdf5; border:1px solid #a7f3d0; border-radius:8px; color:#065f46; font-weight:700;">
                        <i class="fa-solid fa-circle-check"></i> This trip is completed. Tax invoice has been generated for customer.
                    </div>
                `)}
            </div>
        `;
    }

    function startTripAction(id) {
        Utils.confirm(`Start trip ${id}?`, () => {
            StorageManager.updateBookingStatus(id, 'In Progress');
            Utils.showToast(`Trip ${id} is now In Progress!`, 'info');
            renderTripDetails();
        });
    }

    function completeTripAction(id) {
        Utils.confirm(`Complete trip ${id}?`, () => {
            StorageManager.updateBookingStatus(id, 'Completed', {
                completedAt: new Date().toISOString()
            });
            Utils.showToast(`Trip ${id} marked as Completed!`, 'success');
            renderTripDetails();
        });
    }

    document.addEventListener('DOMContentLoaded', renderTripDetails);
</script>
</body>
</html>
