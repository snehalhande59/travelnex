<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Login | TRAVELNEX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/common.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(27, 7, 66, 0.96) 0%, rgba(67, 20, 135, 0.92) 50%, rgba(124, 58, 237, 0.88) 100%),
                        url('https://images.unsplash.com/photo-1506015391300-4802dc74de2e?w=1800') center/cover no-repeat;
            padding: 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: var(--radius-lg);
            padding: 38px 34px;
            box-shadow: var(--shadow-lg);
        }
        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 800;
            color: var(--navy);
            margin-bottom: 20px;
        }
        .auth-logo .icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            background: var(--purple-btn-gradient);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 19px;
        }
        .auth-logo span { color: var(--orange); }
        .demo-chip {
            background: #f1f5f9;
            border: 1px dashed var(--navy);
            border-radius: var(--radius-sm);
            padding: 12px;
            margin-bottom: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
        }
        .demo-chip:hover {
            background: #e2e8f0;
        }
    </style>
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <a href="../customer/index.html" class="auth-logo">
            <div class="icon"><i class="fa-solid fa-shield-halved"></i></div>
            TRAVEL<span>NEX</span> <small style="font-size:11px; background:var(--navy); color:#fff; padding:2px 6px; border-radius:4px; margin-left:6px;">ADMIN</small>
        </a>

        <h2 style="font-size: 22px; text-align: center; margin-bottom: 6px;">Operations Console</h2>
        <p style="text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">
            Sign in to access centralized fleet, booking and driver controls
        </p>

        <!-- Clickable Demo Autofill -->
        <div class="demo-chip" onclick="fillAdminDemo()">
            <div style="font-weight: 700; color: var(--navy); margin-bottom: 2px;">
                <i class="fa-solid fa-bolt"></i> Click to autofill Demo Admin Account:
            </div>
            <div>Email: <strong>admin@travelnex.com</strong></div>
            <div>Password: <strong>Admin@123</strong></div>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="email">Admin Email</label>
                <input type="email" id="email" class="form-control" placeholder="admin@travelnex.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-lg" style="width: 100%; height: 48px; background:var(--purple-btn-gradient); color:#fff; font-weight:700; border:none; border-radius:12px; margin-top: 8px;">
                Sign In to Admin Panel <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div style="border-top: 1px solid var(--border); margin-top: 24px; padding-top: 16px; text-align: center;">
            <div style="display: flex; justify-content: center; gap: 14px; font-size: 12px; font-weight: 600;">
                <a href="../customer/login.html" style="color: var(--blue);">Customer Login</a>
                <span>•</span>
                <a href="../corporate/corporate-login.html" style="color: var(--blue);">Corporate Portal</a>
                <span>•</span>
                <a href="../driver/driver-login.html" style="color: var(--blue);">Driver App</a>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/storage.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
    function fillAdminDemo() {
        document.getElementById('email').value = 'admin@travelnex.com';
        document.getElementById('password').value = 'Admin@123';
        Utils.showToast('Admin credentials autofilled!', 'info');
    }

    const current = Auth.getCurrentUser();
    if (current && current.role === 'admin') {
        window.location.href = 'admin-dashboard.html';
    }

    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;

        const res = Auth.login(email, pass, 'admin');
        if (res.success) {
            Utils.showToast('Authenticated as Administrator.', 'success');
            setTimeout(() => {
                window.location.href = 'admin-dashboard.html';
            }, 800);
        } else {
            Utils.showToast(res.message, 'error');
        }
    });
</script>
</body>
</html>
